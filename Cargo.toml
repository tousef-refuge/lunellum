[package]
name = "lunellum"
version = "0.1.0"
edition = "2024"
authors = ["tousef_refuge"]
description = "A version control system built specifically for writers"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.0", features = ["derive", "cargo"] }
colored = "3.1.1"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
walkdir = "2.5.0"

[features]
debug = []
